services:
  app:
    build: .
    image: dtls13-relay-audit
    environment:
      PORT: 8080
      DATA_DIR: /app/data
    volumes:
      - audit-data:/app/data
    ports:
      # configurable host port: HOST_PORT=9000 docker compose up app
      - "${HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  verify:
    build: .
    image: dtls13-relay-audit
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_URL: http://app:8080
    # runs build checks + review-rule tests + HTTP smoke, then exits;
    # the container exit code is the acceptance report
    command: ["node", "verify/run.js"]
    restart: "no"

volumes:
  audit-data:
